      filePattern: src/main/webapp/WEB-INF/applicationContext.xml
  - org.openrewrite.text.FindAndReplace:
      find: '<property name="systemPropertiesModeName" value="SYSTEM_PROPERTIES_MODE_OVERRIDE"/>'
      replace: ''
      filePattern: src/main/webapp/WEB-INF/applicationContext.xml
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <flow:executor id="flowExecutor" registry-ref="flowRegistry" repository-type="simple">
            <flow:execution-attributes>
              <flow:alwaysRedirectOnPause value="false"/>
            </flow:execution-attributes>
          </flow:executor>
      replace: |-
        <webflow:flow-executor id="flowExecutor">
            <webflow:flow-execution-listeners><webflow:listener ref="facesContextListener"/></webflow:flow-execution-listeners>
            <webflow:flow-execution-repository max-execution-snapshots="30"/>
            <webflow:flow-execution-attributes>
              <webflow:always-redirect-on-pause value="false"/>
            </webflow:flow-execution-attributes>
