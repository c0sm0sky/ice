type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.FixPrimeFacesCompatibilityXhtml
displayName: Convert compatibility page interactions to PrimeFaces APIs
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/extras/coverage.xhtml
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)<p:autoComplete id="suggestionField"[^>]*>.*?</p:autoComplete>'
      regex: true
      replace: |-
        <p:autoComplete id="suggestionField" value="#{componentsBean.coverageSuggestion}"
                        completeMethod="#{componentsBean.completeCoverageSuggestions}" minQueryLength="1" queryDelay="250"/>
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)([ ]*)<p:commandLink\b(?=[^>]*\bvalue="Pokaż potwierdzenie")[^>]*/>'
      regex: true
      replace: |-
        $1<p:commandLink id="coverageConfirmLink" value="Pokaż potwierdzenie" partialSubmit="true" process="@form" update="@form">
        $1  <p:confirm header="Potwierdzenie" message="Potwierdź operację" icon="pi pi-exclamation-triangle"/>
        $1</p:commandLink>
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)([ ]*)<p:confirmDialog id="coverageConfirmation"[^>]*/>'
      regex: true
      replace: |-
        $1<p:confirmDialog id="coverageConfirmation" global="true" header="Potwierdzenie">
        $1  <p:commandButton value="Tak" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
        $1  <p:commandButton value="Nie" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times"/>
        $1</p:confirmDialog>
  - org.openrewrite.text.FindAndReplace:
      find: '<h:panelGroup styleClass="compatibility-context-target" menuPopup="coverageContextMenu">'
      replace: '<h:panelGroup id="compatibilityContextTarget" styleClass="compatibility-context-target">'
  - org.openrewrite.text.FindAndReplace:
      find: '<p:contextMenu id="coverageContextMenu">'
      replace: '<p:contextMenu id="coverageContextMenu" for="compatibilityContextTarget">'
  - org.openrewrite.text.FindAndReplace:
      find: 'link="../"'
      replace: 'url="#{request.contextPath}/"'
  - org.openrewrite.text.FindAndReplace:
      find: '<a class="compatibility-back" href="../">'
      replace: '<a class="compatibility-back" href="#{request.contextPath}/">'
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)([ ]*)<p:dialog id="coveragePopup".*?</p:dialog>'
      regex: true
      replace: |-
        $1<p:dialog id="coveragePopup" header="Okno ICEfaces" visible="#{componentsBean.coveragePopupVisible}"
        $1          draggable="true" styleClass="compatibility-popup">
        $1  <h:panelGroup>
        $1    <h:outputText value="Przykładowe okno ICEfaces"/>
        $1    <p:commandLink id="coveragePopupClose" value="Zamknij" actionListener="#{componentsBean.hideCoveragePopup}"
        $1                   partialSubmit="true" process="@form" update="@form"/>
        $1  </h:panelGroup>
        $1</p:dialog>
  - org.openrewrite.text.FindAndReplace:
      find: '<h:panelGroup styleClass="compatibility-tooltip-target" panelTooltip="coverageTooltip">'
      replace: '<h:panelGroup id="coverageTooltipTarget" styleClass="compatibility-tooltip-target">'
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)<p:tooltip id="coverageTooltip".*?</p:tooltip>'
      regex: true
      replace: '<p:tooltip id="coverageTooltip" for="coverageTooltipTarget" value="Informacje o użytkowniku" styleClass="compatibility-tooltip"/>'
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)([ ]*)<p:divider dividerPosition="50" orientation="vertical" styleClass="compatibility-divider">.*?</p:divider>'
      regex: true
      replace: |-
        $1<p:splitter id="coverageSplitter" layout="horizontal" style="height: 150px" styleClass="compatibility-divider">
        $1  <p:splitterPanel styleClass="compatibility-divider-pane">
        $1    <h:outputText value="Pierwszy panel"/>
        $1  </p:splitterPanel>
        $1  <p:splitterPanel styleClass="compatibility-divider-pane">
        $1    <h:outputText value="Drugi panel"/>
        $1  </p:splitterPanel>
        $1</p:splitter>
---
