  # src/main/java/pl/demo/ice/web/RootFlowEntryFilter.java
  - org.openrewrite.text.FindAndReplace:
      find: '"/index.iface?_flowId=main-flow"'
      replace: '"/spring/main-flow"'
      filePattern: src/main/java/pl/demo/ice/web/RootFlowEntryFilter.java
  - org.openrewrite.text.FindAndReplace:
      find: ' && "GET".equalsIgnoreCase(httpRequest.getMethod())'
      replace: ''
      filePattern: src/main/java/pl/demo/ice/web/RootFlowEntryFilter.java

  # src/main/webapp/WEB-INF/flows/main-flow.xml
  - org.openrewrite.text.FindAndReplace:
      find: 'http://www.springframework.org/schema/webflow/spring-webflow-1.0.xsd'
      replace: 'https://www.springframework.org/schema/webflow/spring-webflow.xsd'
      filePattern: src/main/webapp/WEB-INF/flows/main-flow.xml
  - org.openrewrite.text.FindAndReplace:
      find: '<var name="userBean" scope="flow"/>'
      replace: ''
      filePattern: src/main/webapp/WEB-INF/flows/main-flow.xml
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <start-actions>
            <bean-action bean="userBean" method="getCurrentPageView">
              <method-result name="view" scope="flow"/>
            </bean-action>
          </start-actions>
      replace: ''
      filePattern: src/main/webapp/WEB-INF/flows/main-flow.xml
  - org.openrewrite.text.FindAndReplace:
      find: '<start-state idref="entry"/>'
      replace: ''
      filePattern: src/main/webapp/WEB-INF/flows/main-flow.xml
  - org.openrewrite.text.FindAndReplace:
      find: 'xsi:schemaLocation="http://www.springframework.org/schema/webflow https://www.springframework.org/schema/webflow/spring-webflow.xsd">'
