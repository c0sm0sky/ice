  # src/main/java/pl/demo/ice/db/UserDataInitializer.java
  - org.openrewrite.text.FindAndReplace:
      find: 'createQuery("from User u where u.login = :login")'
      replace: 'createSelectionQuery("from User u where u.login = :login", User.class)'
      filePattern: src/main/java/pl/demo/ice/db/UserDataInitializer.java
  - org.openrewrite.text.FindAndReplace:
      find: '.setString('
      replace: '.setParameter('
      filePattern: src/main/java/pl/demo/ice/db/UserDataInitializer.java
  - org.openrewrite.text.FindAndReplace:
      find: 'session.save(admin)'
      replace: 'session.persist(admin)'
