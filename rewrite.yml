type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.RootFlowUrlChanges
displayName: Migrate root flow URL handling
description: Forward root requests to Web Flow and keep generated flow links at the application root.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/java/pl/demo/ice/web/RootFlowEntryFilter.java
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: '"/index.iface?_flowId=main-flow"'
      replace: '"/spring/main-flow"'
  - org.openrewrite.text.FindAndReplace:
      find: ' && "GET".equalsIgnoreCase(httpRequest.getMethod())'
      replace: ''
  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/main/java/pl/demo/ice/web/RootFlowUrlHandler.java
      fileContents: |-
        package pl.demo.ice.web;

        import jakarta.servlet.http.HttpServletRequest;
        import org.springframework.webflow.context.servlet.DefaultFlowUrlHandler;

        /** Utrzymuje adresy Web Flow w katalogu głównym aplikacji i odtwarza stan wykonania po odesłaniu formularza. */
        public class RootFlowUrlHandler extends DefaultFlowUrlHandler {
            private static final String EXECUTION_KEY = RootFlowUrlHandler.class.getName() + ".executionKey";

            /** Odczytuje aktywne wykonanie z parametrów żądania lub sesji. */
            @Override
            public String getFlowExecutionKey(HttpServletRequest request) {
                String key = request.getParameter("execution");
                if (key == null || key.isBlank()) {
                    key = request.getParameter("jakarta.faces.ViewState");
                }
                if (key == null || key.isBlank()) {
                    key = (String) request.getSession().getAttribute(EXECUTION_KEY);
                }
                if (key != null && key.matches("e[0-9]+s[0-9]+")) {
                    request.getSession().setAttribute(EXECUTION_KEY, key);
                    return key;
                }
                return super.getFlowExecutionKey(request);
            }

            /** Zapisuje klucz dla następnego żądania i generuje adres w katalogu głównym. */
            @Override
            public String createFlowExecutionUrl(String flowId, String flowExecutionKey, HttpServletRequest request) {
                request.getSession().setAttribute(EXECUTION_KEY, flowExecutionKey);
                return request.getContextPath() + "/";
            }

            /** Rozpoczyna nowe wykonanie flow w katalogu głównym aplikacji. */
            @Override
            public String createFlowDefinitionUrl(String flowId, org.springframework.webflow.core.collection.AttributeMap<?> input,
                                                  HttpServletRequest request) {
                return request.getContextPath() + "/";
            }
        }
      overwriteExisting: false
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.WebXmlChanges
displayName: Apply grouped changes to src/main/webapp/WEB-INF/web.xml
description: Remove ICEfaces servlet infrastructure and register the Faces and Spring Web Flow endpoints.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/WEB-INF/web.xml
recipeList:
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "/web-app/context-param[param-name='com.icesoft.faces.actionURLSuffix' or param-name='com.icesoft.faces.synchronousUpdate']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "/web-app/listener[listener-class='com.icesoft.faces.util.event.servlet.ContextEventRepeater']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "/web-app/filter[filter-name='Spring Web Flow Cleanup']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "/web-app/filter-mapping[filter-name='Spring Web Flow Cleanup']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "/web-app/servlet[servlet-name='Persistent Faces Servlet' or servlet-name='Blocking Servlet']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "/web-app/servlet-mapping[servlet-name='Persistent Faces Servlet' or servlet-name='Blocking Servlet']"
  - org.openrewrite.text.FindAndReplace:
      find: 'https://jakarta.ee/xml/ns/jakartaee/web-app_5_0.xsd'
      replace: 'https://jakarta.ee/xml/ns/jakartaee/web-app_6_1.xsd'
  - org.openrewrite.text.FindAndReplace:
      find: 'version="5.0"'
      replace: 'version="6.1"'
  - org.openrewrite.text.FindAndReplace:
      find: '<display-name>Ice</display-name>'
      replace: '<display-name>Ice PrimeFaces</display-name>'
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>*.faces</url-pattern>
          </servlet-mapping>
      replace: |-
        <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>/faces/*</url-pattern>
          </servlet-mapping>
          <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>*.faces</url-pattern>
          </servlet-mapping>
  - org.openrewrite.text.FindAndReplace:
      find: '<session-config><session-timeout>30</session-timeout></session-config>'
      replace: |-
        <servlet>
          <servlet-name>Spring MVC Dispatcher Servlet</servlet-name>
          <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>
          <init-param>
            <param-name>contextConfigLocation</param-name>
            <param-value>/WEB-INF/dispatcher-servlet.xml</param-value>
          </init-param>
          <load-on-startup>2</load-on-startup>
        </servlet>
        <servlet-mapping>
          <servlet-name>Spring MVC Dispatcher Servlet</servlet-name>
          <url-pattern>/spring/*</url-pattern>
        </servlet-mapping>
        <session-config><session-timeout>30</session-timeout><tracking-mode>COOKIE</tracking-mode></session-config>
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.UserPersistenceChanges
displayName: Apply Hibernate API changes to user persistence classes
description: Update Hibernate query and persistence calls in the DAO and startup data initializer.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: 'src/main/java/pl/demo/ice/db/User{Dao,DataInitializer}.java'
recipeList:
  # Najpierw zmienia metody na podstawie typów; podmiany tekstu później przekształcają źródło Java w zwykły tekst.
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: 'org.hibernate.Query#setString(..)'
      newMethodName: setParameter
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: 'org.hibernate.Session#save(..)'
      newMethodName: persist
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: 'org.hibernate.Query#list()'
      newMethodName: getResultList
  - org.openrewrite.text.FindAndReplace:
      find: 'createQuery("from User u where u.login = :login")'
      replace: 'createSelectionQuery("from User u where u.login = :login", User.class)'
  - org.openrewrite.text.FindAndReplace:
      find: 'createQuery("from User u order by u.login")'
      replace: 'createSelectionQuery("from User u order by u.login", User.class)'
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.ApplicationContextChanges
displayName: Apply grouped changes to src/main/webapp/WEB-INF/applicationContext.xml
description: Update database, Hibernate, and Spring Web Flow wiring for the migrated application.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/WEB-INF/applicationContext.xml
recipeList:
  # Najpierw wykonuje zmiany strukturalne XML; późniejsze recepty tekstowe aktualizują adresy schematów i bloki Web Flow.
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: "//*[local-name()='bean'][@id='dataSource']"
      attributeName: class
      oldValue: org.apache.commons.dbcp.BasicDataSource
      newValue: org.apache.commons.dbcp2.BasicDataSource
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: "//*[local-name()='bean'][@id='sessionFactory']"
      attributeName: class
      oldValue: org.springframework.orm.hibernate3.LocalSessionFactoryBean
      newValue: org.springframework.orm.jpa.hibernate.LocalSessionFactoryBean
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: "//*[local-name()='bean'][@id='transactionManager']"
      attributeName: class
      oldValue: org.springframework.orm.hibernate3.HibernateTransactionManager
      newValue: org.springframework.orm.jpa.hibernate.HibernateTransactionManager
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: "//*[local-name()='property'][@name='maxActive']"
      attributeName: name
      oldValue: maxActive
      newValue: maxTotal
  - org.openrewrite.xml.ChangeTagValue:
      elementName: "//*[local-name()='prop'][@key='hibernate.current_session_context_class']"
      oldValue: org.springframework.orm.hibernate3.SpringSessionContext
      newValue: org.springframework.orm.jpa.hibernate.SpringSessionContext
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: "//*[local-name()='bean'][@id='propertyConfigurer']"
      attributeName: class
      oldValue: org.springframework.beans.factory.config.PropertyPlaceholderConfigurer
      newValue: org.springframework.context.support.PropertySourcesPlaceholderConfigurer
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "//*[local-name()='bean'][@id='propertyConfigurer']/*[local-name()='property'][@name='systemPropertiesModeName']"
  - org.openrewrite.text.FindAndReplace:
      find: 'xmlns:flow="http://www.springframework.org/schema/webflow-config"'
      replace: 'xmlns:webflow="http://www.springframework.org/schema/webflow-config"'
  - org.openrewrite.text.FindAndReplace:
      find: 'xmlns:webflow="http://www.springframework.org/schema/webflow-config"(?![\s\S]*xmlns:faces=)'
      replace: |-
        xmlns:webflow="http://www.springframework.org/schema/webflow-config"
               xmlns:faces="http://www.springframework.org/schema/faces"
      regex: true
      dotAll: true
  - org.openrewrite.text.FindAndReplace:
      find: 'http://www.springframework.org/schema/beans/spring-beans-2.0.xsd'
      replace: 'https://www.springframework.org/schema/beans/spring-beans.xsd'
  - org.openrewrite.text.FindAndReplace:
      find: 'http://www.springframework.org/schema/tx/spring-tx-2.0.xsd'
      replace: 'https://www.springframework.org/schema/tx/spring-tx.xsd'
  - org.openrewrite.text.FindAndReplace:
      find: 'http://www.springframework.org/schema/webflow-config/spring-webflow-config-1.0.xsd'
      replace: 'https://www.springframework.org/schema/webflow-config/spring-webflow-config.xsd'
  - org.openrewrite.text.FindAndReplace:
      find: 'https://www.springframework.org/schema/webflow-config/spring-webflow-config.xsd(?![\s\S]*spring-faces.xsd)'
      replace: |-
        https://www.springframework.org/schema/webflow-config/spring-webflow-config.xsd
                 http://www.springframework.org/schema/faces https://www.springframework.org/schema/faces/spring-faces.xsd
      regex: true
      dotAll: true
  # Dopasowuje elementy Web Flow niezależnie od wcięć i kolejności atrybutów.
  - org.openrewrite.text.FindAndReplace:
      find: '<flow:executor\b[^>]*>[\s\S]*?</flow:executor>'
      replace: |-
        <webflow:flow-executor id="flowExecutor">
          <webflow:flow-execution-listeners><webflow:listener ref="facesContextListener"/></webflow:flow-execution-listeners>
          <webflow:flow-execution-repository max-execution-snapshots="30"/>
          <webflow:flow-execution-attributes>
            <webflow:always-redirect-on-pause value="false"/>
          </webflow:flow-execution-attributes>
        </webflow:flow-executor>
      regex: true
      dotAll: true
  - org.openrewrite.text.FindAndReplace:
      find: '<flow:registry\b[^>]*>[\s\S]*?</flow:registry>'
      replace: |-
        <webflow:flow-registry id="flowRegistry" flow-builder-services="flowBuilderServices" base-path="/WEB-INF">
          <webflow:flow-location path="/flows/main-flow.xml" id="main-flow"/>
        </webflow:flow-registry>
        <faces:flow-builder-services id="flowBuilderServices"/>
        <bean id="facesContextListener" class="org.springframework.faces.webflow.FlowFacesContextLifecycleListener"/>
      regex: true
      dotAll: true
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.JbossDeploymentStructureChanges
displayName: Apply grouped changes to src/main/webapp/WEB-INF/jboss-deployment-structure.xml
description: Remove server JSF module exclusions while retaining the Hibernate module exclusion.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/WEB-INF/jboss-deployment-structure.xml
recipeList:
  # Zachowuje izolację modułu Hibernate; usuwa tylko wykluczenia serwerowych modułów JSF/JPA.
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "//*[local-name()='exclude-subsystems'][*[local-name()='subsystem'][@name='jsf']]"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "//*[local-name()='module'][@name='javax.faces.api']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "//*[local-name()='module'][@name='javax.persistence.api']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "//*[local-name()='module'][@name='org.jboss.as.jsf']"
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "//*[local-name()='module'][@name='com.sun.jsf-impl']"
