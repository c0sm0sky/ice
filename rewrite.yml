  - org.openrewrite.text.FindAndReplace:
      find: '.setString('
      replace: '.setParameter('
      filePattern: src/main/java/pl/demo/ice/db/UserDao.java
  - org.openrewrite.text.FindAndReplace:
      find: '.list()'
      replace: '.getResultList()'
