---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.IceToPrimeFaces
displayName: Migrate ICEfaces XHTML components to PrimeFaces and Jakarta Faces
description: Applies tag-library-derived mappings and explicit aliases for ICEfaces XHTML components.
recipeList:
  # Migruje Java EE do Jakarta, a web.xml ustawia według wersji Servletu z POM-a.
  - pl.demo.ice.rewrite.MigrateJakartaToConfiguredServletVersion:
      servletVersion: '${migration.jakarta-servlet.version}'
  # Przekształca stare definicje Web Flow 1.x przed normalizacją przepływu aplikacji.
  - pl.demo.ice.rewrite.UpgradeMainFlowWithWebFlowUpgrader
  # Plugin mapuje tagi ICEfaces i migruje sortowanie/cache tabel dla całego projektu.
  - pl.demo.ice.migrate.IceComponentsToPrimeFaces
  # Widokami zarządza Web Flow; migrowany bean nie przechowuje już bieżącej strony w sesji.
  - pl.demo.ice.migrate.RemoveLegacyCurrentPageTracking
  - pl.demo.ice.migrate.InvokeReportCleanupMethod
  - pl.demo.ice.migrate.RemoveLegacyReportActionProxy
  - pl.demo.ice.migrate.FixPrimeFacesCompatibilityXhtml
  - pl.demo.ice.migrate.ReportDownloadToPrimeFaces
  - pl.demo.ice.migrate.RemoveIcefacesRimeStylesheet
  # Aktualizuje beany DBCP, Hibernate, Spring i Web Flow w applicationContext.xml.
  - pl.demo.ice.migrate.ApplicationContextChanges
  # Zmień pakiet Spring ORM, zanim tekstowe recepty spłaszczą XML do zwykłego tekstu.
  - pl.demo.ice.rewrite.MigrateSpringInfrastructure:
      phase: spring7
  - pl.demo.ice.migrate.RemovePrimeFacesRedirectOnPause
  - pl.demo.ice.migrate.ExplicitSubflowIds
  # Usuwa wycofane moduły Spring 2, zanim recepty podbiją wersje zależności.
  - pl.demo.ice.migrate.RemoveLegacySpringModules
  # Uruchamia oficjalny łańcuch migracji Spring Framework od 5.0 do 7.0.
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0
  # Uruchamia oficjalną migrację i uniwersalne zmiany nazw metod Hibernate.
  - pl.demo.ice.rewrite.MigrateHibernateWithOfficialRecipes
  # Usuwa konfigurację serwletów ICEfaces i dodaje mapowania Jakarta Faces oraz Spring.
  - pl.demo.ice.rewrite.MigrateServletWebXml:
      phase: upload
  - pl.demo.ice.migrate.WebXmlChanges
  - pl.demo.ice.migrate.ConfigurePrimeFacesTheme
  # Przekazuje żądania z głównego adresu do Web Flow i pozostawia generowane adresy flow w katalogu głównym.
  - pl.demo.ice.migrate.RootFlowUrlChanges
  # Dostosowuje przepływ logowania i sesyjny zakres beana do aplikacji.
  - pl.demo.ice.migrate.NormalizeMainFlowForWebFlow4
  # Usuwa stary faces-config.xml i tworzy dispatcher-servlet.xml.
  - pl.demo.ice.migrate.RemoveLegacyFacesConfiguration
  - org.openrewrite.DeleteSourceFiles:
      filePattern: src/main/java/pl/demo/ice/web/SessionFlowPhaseListener.java
  # Usuwa konfigurowalne, stare wykluczenia modułów JSF/JPA i podsystemu JSF WildFlya.
  - pl.demo.ice.rewrite.MigrateWildFlyDeploymentStructure:
      filePattern: src/main/webapp/WEB-INF/jboss-deployment-structure.xml
      modulesToUnexclude: javax.faces.api,javax.persistence.api,org.jboss.as.jsf,com.sun.jsf-impl
      subsystemsToUnexclude: jsf
  # Pełną migrację Faces uruchamiamy po zmianach XML i mapowaniu komponentów ICEfaces.
  - pl.demo.ice.rewrite.MigrateJakartaToConfiguredServletVersion:
      phase: faces-final
  # Migracja działa w kopii przygotowanej przez profil, dzięki czemu legacy pozostaje na Javie 8.
  - pl.demo.ice.rewrite.MigrateJava25
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.RemoveLegacySpringModules
displayName: Remove obsolete Spring 2 modules before upgrading Spring
description: Remove Spring modules no longer published in modern Framework releases before the upgrade chain resolves the Maven model.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/pom.xml'
recipeList:
  - org.openrewrite.maven.RemoveManagedDependency:
      groupId: org.springframework
      artifactId: spring-dao
  - org.openrewrite.maven.RemoveManagedDependency:
      groupId: org.springframework
      artifactId: spring-hibernate3
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.springframework
      artifactId: spring-dao
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.springframework
      artifactId: spring-hibernate3
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.PrimeFacesPomChanges
displayName: Migrate and finalize the PrimeFaces Maven POM
description: Run separately after source migration to update dependencies, properties, and build plugins.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/pom.xml'
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.icefaces
      artifactId: icefaces
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.icefaces
      artifactId: icefaces-comps
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.icefaces
      artifactId: icefaces-facelets
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.myfaces.core
      artifactId: myfaces-api
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.myfaces.core
      artifactId: myfaces-impl
  - org.openrewrite.maven.RemoveProperty:
      propertyName: icefaces.version
  - org.openrewrite.maven.RemoveProperty:
      propertyName: myfaces.version
  - org.openrewrite.maven.AddDependency:
      groupId: org.primefaces
      artifactId: primefaces
      version: '${migration.primefaces.version}'
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework
      oldArtifactId: spring-webflow
      newGroupId: org.springframework.webflow
      newArtifactId: spring-webflow
      newVersion: '${migration.spring-webflow.version}'
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: commons-dbcp
      oldArtifactId: commons-dbcp
      newGroupId: org.apache.commons
      newArtifactId: commons-dbcp2
      newVersion: '${migration.commons-dbcp.version}'
  - org.openrewrite.maven.RemoveDependency:
      groupId: javassist
      artifactId: javassist
  - org.openrewrite.maven.RemoveProperty:
      propertyName: javassist.version
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring.version
      newValue: '${migration.spring.version}'
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-webflow.version
      newValue: '${migration.spring-webflow.version}'
  - org.openrewrite.maven.ChangePropertyValue:
      key: hibernate.version
      newValue: '${migration.hibernate.version}'
  - org.openrewrite.maven.ChangePropertyValue:
      key: postgresql.version
      newValue: '${migration.postgresql.version}'
  - org.openrewrite.maven.AddManagedDependency:
      groupId: org.springframework
      artifactId: spring-orm
      version: '${migration.spring.version}'
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework
      artifactId: spring-orm
      version: '${migration.spring.version}'
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.webflow
      artifactId: spring-faces
      version: '${migration.spring-webflow.version}'
  - org.openrewrite.maven.ChangeDependencyScope:
      groupId: jakarta.servlet
      artifactId: jakarta.servlet-api
      newScope: provided
  - org.openrewrite.maven.AddDependency:
      groupId: jakarta.faces
      artifactId: jakarta.faces-api
      version: '${migration.jakarta-faces-api.version}'
      scope: provided
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.apache.maven.plugins
      artifactId: maven-clean-plugin
      newVersion: '${migration.maven-clean-plugin.version}'
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.apache.maven.plugins
      artifactId: maven-compiler-plugin
      newVersion: '${migration.maven-compiler-plugin.version}'
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.apache.maven.plugins
      artifactId: maven-war-plugin
      newVersion: '${migration.maven-war-plugin.version}'
  - org.openrewrite.maven.RenamePropertyKey:
      oldKey: servlet-api.version
      newKey: jakarta.servlet.version
  - org.openrewrite.maven.RenamePropertyKey:
      oldKey: commons-dbcp.version
      newKey: commons-dbcp2.version
  - org.openrewrite.maven.RenamePropertyKey:
      oldKey: maven-clean-plugin.version
      newKey: maven.clean.plugin.version
  - org.openrewrite.maven.RenamePropertyKey:
      oldKey: maven-compiler-plugin.version
      newKey: maven.compiler.plugin.version
  - org.openrewrite.maven.RenamePropertyKey:
      oldKey: maven-war-plugin.version
      newKey: maven.war.plugin.version
  - org.openrewrite.maven.ChangePluginConfiguration:
      groupId: org.apache.maven.plugins
      artifactId: maven-clean-plugin
      configuration: null
  - org.openrewrite.maven.ChangePluginConfiguration:
      groupId: org.apache.maven.plugins
      artifactId: maven-compiler-plugin
      configuration: '<encoding>UTF-8</encoding>'
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: "//*[local-name()='project']/*[local-name()='profiles']/*[local-name()='profile'][*[local-name()='id' and text()='primefaces-migration']]"
  - org.openrewrite.xml.ChangeTagValue:
      elementName: /project/build/finalName
      oldValue: ice
      newValue: prime
  - org.openrewrite.maven.ExtractVersionsAsProperties
  # Ekstrakcja potrafi odtworzyć wersję 5.0.0 z recepty Jakarta; przywracamy wersję z profilu.
  - org.openrewrite.maven.ChangePropertyValue:
      key: jakarta.servlet.version
      newValue: '${migration.jakarta-servlet.version}'
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.NormalizeMainFlowForWebFlow4
displayName: Apply Web Flow 4 updates to the main flow
description: Use the session-scoped user bean and the login decision as the flow entry state.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/WEB-INF/flows/main-flow.xml
recipeList:
  # Upgrader pomija atrybut class tej starej zmiennej flow; userBean jest beanem Springa w sesji.
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: //webflow:var[@name='userBean']
  # Ta akcja inicjalizowała flowScope.view wyłącznie dla starego, dynamicznego widoku wejściowego.
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: //webflow:on-start
  # Po usunięciu zmiennej flow odwołuje się bezpośrednio do sesyjnego beana Springa.
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: //webflow:if[@test='flowScope.userBean.loggedIn']
      attributeName: test
      oldValue: flowScope.userBean.loggedIn
      newValue: userBean.loggedIn
  # Wznawia aktywne wykonania po kluczu; nowe rozpoczynają się od istniejącej decyzji logowania.
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: /webflow:flow
      attributeName: start-state
      oldValue: entry
      newValue: loginDecision
  - org.openrewrite.xml.RemoveXmlTag:
      xPath: //webflow:view-state[@id='entry']
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.RemoveLegacyFacesConfiguration
displayName: Remove legacy ICEfaces configuration and use WildFly Faces
description: Delete the legacy Faces descriptor and create the Spring Faces MVC configuration.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/WEB-INF/faces-config.xml
recipeList:
  - org.openrewrite.DeleteSourceFiles:
      filePattern: src/main/webapp/WEB-INF/faces-config.xml

  # Rejestruje zasoby Spring Faces i handler adresów Web Flow w katalogu głównym.
  - org.openrewrite.xml.CreateXmlFile:
      relativeFileName: src/main/webapp/WEB-INF/dispatcher-servlet.xml
      fileContents: |-
        <?xml version="1.0" encoding="UTF-8"?>
        <beans xmlns="http://www.springframework.org/schema/beans"
               xmlns:faces="http://www.springframework.org/schema/faces"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:schemaLocation="
                 http://www.springframework.org/schema/beans https://www.springframework.org/schema/beans/spring-beans.xsd
                 http://www.springframework.org/schema/faces https://www.springframework.org/schema/faces/spring-faces.xsd">
          <faces:resources order="-1"/>
          <bean id="rootFlowUrlHandler" class="pl.demo.ice.web.RootFlowUrlHandler"/>
          <bean class="org.springframework.webflow.mvc.servlet.FlowHandlerMapping">
            <property name="flowRegistry" ref="flowRegistry"/>
            <property name="flowUrlHandler" ref="rootFlowUrlHandler"/>
            <property name="order" value="0"/>
          </bean>
          <bean class="org.springframework.faces.webflow.JsfFlowHandlerAdapter">
            <property name="flowExecutor" ref="flowExecutor"/>
            <property name="flowUrlHandler" ref="rootFlowUrlHandler"/>
          </bean>
        </beans>
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.IceComponentsToPrimeFaces
displayName: Migrate ICEfaces XHTML components to PrimeFaces
description: Convert known ICEfaces tags across Facelets pages and stop with a component-specific hint when a used tag needs structural or Java-model changes.
