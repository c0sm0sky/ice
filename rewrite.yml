      elementName: //body
      newName: h:body
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:form
      newName: h:form
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:inputText
      newName: p:inputText
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:inputSecret
      newName: p:password
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:commandLink
      newName: p:commandLink
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:commandButton
      newName: p:commandButton
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:messages
      newName: p:messages
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:outputLabel
      newName: p:outputLabel
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:outputText
      newName: h:outputText
  - org.openrewrite.xml.ChangeTagName:
      elementName: //ice:outputStyle
      newName: h:outputStylesheet

  # Zachowuje obsługę AJAX i renderowanie dla każdego migrowanego komponentu akcji.
  - org.openrewrite.xml.AddTagAttribute:
      elementName: //p:commandLink
      attributeName: process
      newValue: '@form'
  - org.openrewrite.xml.AddTagAttribute:
      elementName: //p:commandLink
      attributeName: update
      newValue: '@form'
  - org.openrewrite.xml.AddTagAttribute:
      elementName: //p:commandButton
      attributeName: process
      newValue: '@form'
  - org.openrewrite.xml.AddTagAttribute:
      elementName: //p:commandButton
      attributeName: update
      newValue: '@form'

  - pl.demo.ice.migrate.PrimeFacesStylesheetToResourceLibrary
---
