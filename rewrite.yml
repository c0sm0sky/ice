      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)  <context-param>\s*<param-name>com\.icesoft\.faces\.synchronousUpdate</param-name>.*?</context-param>\s*'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)<context-param>\s*<param-name>com\.icesoft\.faces\.synchronousUpdate</param-name>.*?</context-param>\s*'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)  <listener>\s*<listener-class>com\.icesoft\.faces\.util\.event\.servlet\.ContextEventRepeater</listener-class>\s*</listener>\s*'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)  <filter>\s*<filter-name>Spring Web Flow Cleanup</filter-name>.*?</filter-mapping>\s*'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)<filter>\s*<filter-name>Spring Web Flow Cleanup</filter-name>.*?</filter>\s*<filter-mapping>\s*<filter-name>Spring Web Flow Cleanup</filter-name>.*?</filter-mapping>\s*'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: 'javax\.faces\.webapp\.FacesServlet'
      replace: 'jakarta.faces.webapp.FacesServlet'
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
