recipeList:
  - org.openrewrite.xml.ChangeTagAttributeKey:
      xPath: //h:outputStylesheet/@href
      newAttributeName: name
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: //h:outputStylesheet
