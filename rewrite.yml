type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.ReportDownloadXhtml
displayName: Migrate the report download XHTML
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/extras/report-detail.xhtml
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)<ice:outputResource id="downloadReport" resource="#\{(?:sessionScope\.)?reportBean\.reportResource\}"\s+attachment="true" fileName="raport-uzytkownikow\.csv" mimeType="text/csv"\s+label="Pobierz raport CSV" styleClass="flow-action flow-action-primary"\s*/>'
      regex: true
      replace: |-
        <p:commandLink id="downloadReport" value="Pobierz raport CSV" ajax="false"
                       styleClass="flow-action flow-action-primary">
          <p:fileDownload value="#{reportBean.reportResource}" />
        </p:commandLink>
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.ReportDownloadBean
displayName: Migrate the report resource bean to StreamedContent
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/java/pl/demo/ice/extras/ReportBean.java
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: 'import com.icesoft.faces.context.Resource;'
      replace: 'import org.primefaces.model.StreamedContent;'
  - org.openrewrite.text.FindAndReplace:
      find: 'import com.icesoft.faces.context.StringResource;'
      replace: |-
        import java.io.ByteArrayInputStream;
        import java.nio.charset.StandardCharsets;
        import org.primefaces.model.DefaultStreamedContent;
  - org.openrewrite.text.FindAndReplace:
      find: 'private Resource reportResource = new StringResource("", "UTF-8");'
      replace: 'private StreamedContent reportResource;'
  - org.openrewrite.text.FindAndReplace:
      find: 'public Resource getReportResource()'
      replace: 'public StreamedContent getReportResource()'
  - org.openrewrite.text.FindAndReplace:
      find: 'reportResource = new StringResource(csv.toString(), "UTF-8");'
      replace: |-
        byte[] reportBytes = csv.toString().getBytes(StandardCharsets.UTF_8);
                reportResource = DefaultStreamedContent.builder()
                        .name("raport-uzytkownikow.csv")
                        .contentType("text/csv")
                        .stream(() -> new ByteArrayInputStream(reportBytes))
                        .build();
---
