          </servlet-mapping>
      replace: |-
        <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>/faces/*</url-pattern>
          </servlet-mapping>
          <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>*.faces</url-pattern>
          </servlet-mapping>
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)  <servlet>\s*<servlet-name>Persistent Faces Servlet</servlet-name>.*?</servlet-mapping>\s*'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/web.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)<servlet-mapping>\s*<servlet-name>Persistent Faces Servlet</servlet-name>.*?</servlet-mapping>\s*'
