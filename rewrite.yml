type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.RemoveLegacyCurrentPageTracking
displayName: Remove legacy current-page tracking from the migrated bean
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/java/pl/demo/ice/UserBean.java
recipeList:
