        <decision-state id="entry">
            <if test="userBean.currentPageView == '/strona2.xhtml'" then="editUser" else="pageDecision"/>
          </decision-state>
          <decision-state id="pageDecision">
            <if test="userBean.currentPageView == '/strona1.xhtml'" then="users" else="loginDecision"/>
          </decision-state>
      regex: true
      filePattern: src/main/webapp/WEB-INF/flows/main-flow.xml
  - org.openrewrite.text.FindAndReplace:
      find: '<if test="${flowScope.userBean.loggedIn}" then="users" else="login"/>'
      replace: '<if test="userBean.loggedIn" then="users" else="login"/>'
      filePattern: src/main/webapp/WEB-INF/flows/main-flow.xml

  # src/main/java/pl/demo/ice/web/RootFlowUrlHandler.java (flow URL support)
  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/main/java/pl/demo/ice/web/RootFlowUrlHandler.java
      fileContents: |-
        package pl.demo.ice.web;

        import jakarta.servlet.http.HttpServletRequest;
        import org.springframework.webflow.context.servlet.DefaultFlowUrlHandler;

        public class RootFlowUrlHandler extends DefaultFlowUrlHandler {
            private static final String EXECUTION_KEY = RootFlowUrlHandler.class.getName() + ".executionKey";

            @Override
            public String getFlowExecutionKey(HttpServletRequest request) {
                String key = request.getParameter("execution");
                if (key == null || key.isBlank()) {
                    key = request.getParameter("jakarta.faces.ViewState");
                }
                if (key == null || key.isBlank()) {
                    key = (String) request.getSession().getAttribute(EXECUTION_KEY);
                }
                if (key != null && key.matches("e[0-9]+s[0-9]+")) {
                    request.getSession().setAttribute(EXECUTION_KEY, key);
                    return key;
                }
                return super.getFlowExecutionKey(request);
            }

            @Override
            public String createFlowExecutionUrl(String flowId, String flowExecutionKey, HttpServletRequest request) {
                request.getSession().setAttribute(EXECUTION_KEY, flowExecutionKey);
                return request.getContextPath() + "/";
            }

            @Override
            public String createFlowDefinitionUrl(String flowId, org.springframework.webflow.core.collection.AttributeMap<?> input,
                                                  HttpServletRequest request) {
                return request.getContextPath() + "/";
            }
        }
      overwriteExisting: false
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.RemoveLegacyFacesConfiguration
displayName: Remove legacy ICEfaces configuration and use WildFly Faces
recipeList:

  # src/main/webapp/WEB-INF/faces-config.xml
  - org.openrewrite.DeleteSourceFiles:
      filePattern: src/main/webapp/WEB-INF/faces-config.xml

  # src/main/webapp/WEB-INF/jboss-deployment-structure.xml
  - org.openrewrite.text.FindAndReplace:
      find: '<exclude-subsystems>\s*<subsystem name="jsf"/>\s*</exclude-subsystems>'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/jboss-deployment-structure.xml
  - org.openrewrite.text.FindAndReplace:
      find: '\s*<module name="(javax\.faces\.api|javax\.persistence\.api|org\.jboss\.as\.jsf|com\.sun\.jsf-impl)"/>'
      replace: ''
      regex: true
      filePattern: src/main/webapp/WEB-INF/jboss-deployment-structure.xml

  # src/main/webapp/WEB-INF/dispatcher-servlet.xml
  - org.openrewrite.xml.CreateXmlFile:
      relativeFileName: src/main/webapp/WEB-INF/dispatcher-servlet.xml
      fileContents: |-
        <?xml version="1.0" encoding="UTF-8"?>
        <beans xmlns="http://www.springframework.org/schema/beans"
               xmlns:faces="http://www.springframework.org/schema/faces"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:schemaLocation="
                 http://www.springframework.org/schema/beans https://www.springframework.org/schema/beans/spring-beans.xsd
                 http://www.springframework.org/schema/faces https://www.springframework.org/schema/faces/spring-faces.xsd">
          <faces:resources order="-1"/>
          <bean id="rootFlowUrlHandler" class="pl.demo.ice.web.RootFlowUrlHandler"/>
          <bean class="org.springframework.webflow.mvc.servlet.FlowHandlerMapping">
            <property name="flowRegistry" ref="flowRegistry"/>
            <property name="flowUrlHandler" ref="rootFlowUrlHandler"/>
            <property name="order" value="0"/>
          </bean>
          <bean class="org.springframework.faces.webflow.JsfFlowHandlerAdapter">
            <property name="flowExecutor" ref="flowExecutor"/>
            <property name="flowUrlHandler" ref="rootFlowUrlHandler"/>
          </bean>
        </beans>
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.IceComponentsToPrimeFaces
displayName: Replace used ICEfaces XHTML components
recipeList:

  # Shared Facelets namespaces and ICEfaces component conversion across XHTML files
  - org.openrewrite.xml.AddTagAttribute:
      elementName: //f:view
      attributeName: xmlns:h
      newValue: jakarta.faces.html
      filePattern: src/main/webapp/**/*.xhtml
  - org.openrewrite.xml.AddTagAttribute:
      elementName: //ui:composition
      attributeName: xmlns:h
      newValue: jakarta.faces.html
      filePattern: src/main/webapp/**/*.xhtml
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: //f:view
      attributeName: xmlns:ui
      oldValue: http://java.sun.com/jsf/facelets
