type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.RootFlowUrlChanges
displayName: Migrate root flow URL handling
description: Forward root requests to Web Flow and keep generated flow links at the application root.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/java/pl/demo/ice/web/RootFlowEntryFilter.java
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: '(?s)            String viewNumber = httpRequest.getParameter\("rvn"\);.*?httpRequest.getRequestDispatcher\(target\).forward\(request, response\);'
      regex: true
      replace: '            httpRequest.getRequestDispatcher("/spring/main-flow").forward(request, response);'
  - org.openrewrite.text.FindAndReplace:
      find: '"/login.iface?_flowId=main-flow"'
      replace: '"/spring/main-flow"'
  - org.openrewrite.text.FindAndReplace:
      find: |-
        (?s)\s*int pathParameter =.*?if \(viewPath\.endsWith\("\.xhtml"\)\) \{.*?return;\s*\}
      regex: true
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: ' && "GET".equalsIgnoreCase(httpRequest.getMethod())'
      replace: ''
  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/main/java/pl/demo/ice/web/RootFlowUrlHandler.java
      fileContents: |-
        package pl.demo.ice.web;

        import jakarta.servlet.http.HttpServletRequest;
        import org.springframework.webflow.context.servlet.DefaultFlowUrlHandler;

        /** Utrzymuje adresy Web Flow w katalogu głównym aplikacji i odtwarza stan wykonania po odesłaniu formularza. */
        public class RootFlowUrlHandler extends DefaultFlowUrlHandler {
            private static final String EXECUTION_KEY = RootFlowUrlHandler.class.getName() + ".executionKey";

            /** Odczytuje aktywne wykonanie z parametrów żądania lub sesji. */
            @Override
            public String getFlowExecutionKey(HttpServletRequest request) {
                String key = request.getParameter("execution");
                if (key == null || key.isBlank()) {
                    key = request.getParameter("jakarta.faces.ViewState");
                }
                if (key == null || key.isBlank()) {
                    key = (String) request.getSession().getAttribute(EXECUTION_KEY);
                }
                if (key != null && key.matches("e[0-9]+s[0-9]+")) {
                    request.getSession().setAttribute(EXECUTION_KEY, key);
                    return key;
                }
                return super.getFlowExecutionKey(request);
            }

            /** Zapisuje klucz dla następnego żądania i generuje adres w katalogu głównym. */
            @Override
            public String createFlowExecutionUrl(String flowId, String flowExecutionKey, HttpServletRequest request) {
                request.getSession().setAttribute(EXECUTION_KEY, flowExecutionKey);
                return request.getContextPath() + "/";
            }

            /** Rozpoczyna nowe wykonanie flow w katalogu głównym aplikacji. */
            @Override
            public String createFlowDefinitionUrl(String flowId, org.springframework.webflow.core.collection.AttributeMap<?> input,
                                                  HttpServletRequest request) {
                return request.getContextPath() + "/";
            }
        }
      overwriteExisting: false
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.WebXmlChanges
displayName: Apply project-specific changes to src/main/webapp/WEB-INF/web.xml
description: Remove ICEfaces servlet infrastructure and register this application's Faces and Spring endpoints.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: src/main/webapp/WEB-INF/web.xml
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: '\s*<context-param>\s*<param-name>com\.icesoft\.faces\.concurrentDOMViews</param-name>\s*<param-value>true</param-value>\s*</context-param>'
      regex: true
      replace: ''

  # Rewrite XML nie dopasowuje tu niezawodnie XPath do deskryptora z domyślną przestrzenią nazw.
  # Usuwamy dokładne bloki ICEfaces i starego filtra, zachowując pozostałą konfigurację.
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <context-param>
            <param-name>com.icesoft.faces.actionURLSuffix</param-name>
            <param-value>.iface</param-value>
          </context-param>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <context-param>
            <param-name>com.icesoft.faces.synchronousUpdate</param-name>
            <param-value>true</param-value>
          </context-param>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <listener>
            <listener-class>com.icesoft.faces.util.event.servlet.ContextEventRepeater</listener-class>
          </listener>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <filter>
            <filter-name>Spring Web Flow Cleanup</filter-name>
            <filter-class>org.springframework.webflow.executor.jsf.FlowSystemCleanupFilter</filter-class>
          </filter>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <filter-mapping>
            <filter-name>Spring Web Flow Cleanup</filter-name>
            <url-pattern>/*</url-pattern>
          </filter-mapping>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet>
            <servlet-name>Persistent Faces Servlet</servlet-name>
            <servlet-class>com.icesoft.faces.webapp.xmlhttp.PersistentFacesServlet</servlet-class>
            <load-on-startup>1</load-on-startup>
          </servlet>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet-mapping>
            <servlet-name>Persistent Faces Servlet</servlet-name>
            <url-pattern>*.iface</url-pattern>
          </servlet-mapping>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet-mapping>
            <servlet-name>Persistent Faces Servlet</servlet-name>
            <url-pattern>/xmlhttp/*</url-pattern>
          </servlet-mapping>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet>
            <servlet-name>Blocking Servlet</servlet-name>
            <servlet-class>com.icesoft.faces.webapp.xmlhttp.BlockingServlet</servlet-class>
            <load-on-startup>1</load-on-startup>
          </servlet>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet-mapping>
            <servlet-name>Blocking Servlet</servlet-name>
            <url-pattern>/block/*</url-pattern>
          </servlet-mapping>
      replace: ''
  - org.openrewrite.text.FindAndReplace:
      find: '<display-name>Ice</display-name>'
      replace: '<display-name>Ice PrimeFaces</display-name>'
  - org.openrewrite.text.FindAndReplace:
      find: |-
        <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>*.faces</url-pattern>
          </servlet-mapping>
      replace: |-
        <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>/faces/*</url-pattern>
          </servlet-mapping>
          <servlet-mapping>
            <servlet-name>Faces Servlet</servlet-name>
            <url-pattern>*.faces</url-pattern>
          </servlet-mapping>
  - org.openrewrite.text.FindAndReplace:
      find: '<session-config><session-timeout>30</session-timeout></session-config>'
      replace: |-
        <servlet>
          <servlet-name>Spring MVC Dispatcher Servlet</servlet-name>
          <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>
          <init-param>
            <param-name>contextConfigLocation</param-name>
            <param-value>/WEB-INF/dispatcher-servlet.xml</param-value>
          </init-param>
          <load-on-startup>2</load-on-startup>
        </servlet>
        <servlet-mapping>
          <servlet-name>Spring MVC Dispatcher Servlet</servlet-name>
          <url-pattern>/spring/*</url-pattern>
        </servlet-mapping>
        <session-config><session-timeout>30</session-timeout><tracking-mode>COOKIE</tracking-mode></session-config>
---
type: specs.openrewrite.org/v1beta/recipe
name: pl.demo.ice.migrate.ApplicationContextChanges
displayName: Apply grouped changes to src/main/webapp/WEB-INF/applicationContext.xml
