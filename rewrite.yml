      newValue: jakarta.faces.core
  - org.openrewrite.xml.ChangeTagAttributeKey:
      xPath: //@xmlns:ice
      newAttributeName: xmlns:p
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: //f:view
      attributeName: xmlns:p
      oldValue: http://www.icesoft.com/icefaces/component
      newValue: http://primefaces.org/ui
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: //ui:composition
      attributeName: xmlns:p
      oldValue: http://www.icesoft.com/icefaces/component
      newValue: http://primefaces.org/ui

  # Globalna zamiana nazw znaczników.
