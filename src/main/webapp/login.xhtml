<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ice="http://www.icesoft.com/icefaces/component"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/WEB-INF/layouts/mainTemplate.xhtml">
  <!--@elvariable id="userBean" type="pl.demo.ice.UserBean"-->
  <ui:define name="title">Logowanie</ui:define>
  <ui:define name="mainPanel">
    <div class="login-page">
        <main class="login-card">
          <h1>Zaloguj się</h1>
            <ice:messages styleClass="messages" globalOnly="true"/>
            <ice:outputText value="#{userBean.message}" styleClass="error"/>
            <div class="field">
              <ice:outputLabel for="user" value="Login"/>
              <ice:inputText id="user" value="#{userBean.login}" styleClass="input"
                             onkeypress="return submitLoginOnEnter(event);"/>
            </div>
            <div class="field">
              <ice:outputLabel for="pass" value="Hasło"/>
              <ice:inputSecret id="pass" value="#{userBean.haslo}" styleClass="input" redisplay="false"
                               onkeypress="return submitLoginOnEnter(event);"/>
            </div>
            <ice:commandLink id="loginAction" value="Zaloguj się" action="#{userBean.login}" styleClass="primary full"/>
        </main>
    </div>
  </ui:define>
</ui:composition>
