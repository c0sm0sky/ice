name: Build WAR

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  war:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Maven 2.2.1
        run: |
          curl --fail --silent --show-error --location \
            https://archive.apache.org/dist/maven/maven-2/2.2.1/binaries/apache-maven-2.2.1-bin.tar.gz \
            --output "$RUNNER_TEMP/apache-maven-2.2.1-bin.tar.gz"
          tar -xzf "$RUNNER_TEMP/apache-maven-2.2.1-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-2.2.1/bin" >> "$GITHUB_PATH"

      - name: Build WAR
        env:
          MAVEN_OPTS: -Dhttps.protocols=TLSv1.2
        run: mvn clean package -DskipTests

      - name: Upload ICE WAR
        uses: actions/upload-artifact@v4
        with:
          name: ice-war
          path: target/ice.war
          if-no-files-found: error

  primefaces-migration:
    name: Build PrimeFaces migration WAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show toolchain
        run: mvn --version

      - name: Build migrated WAR and run tests
        run: mvn clean install -P primefaces-migration

      - name: Upload migrated WAR
        uses: actions/upload-artifact@v4
        with:
          name: prime-migration-war
          path: primefaces-migrated/target/prime.war
          if-no-files-found: error


  publish-release-wars:
    name: Attach WARs to GitHub Release
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    needs: [war, primefaces-migration]
    runs-on: ubuntu-latest
    steps:
      - name: Download built WARs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-war'
          path: dist
          merge-multiple: true

      - name: Upload WARs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.war
          fail_on_unmatched_files: true
