services:
  postgres:
    image: postgres:18
    container_name: ice-postgres
    environment:
      POSTGRES_DB: ice
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: ice_dev
    ports:
      - "5434:5432"
    volumes:
      - ice-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice -d ice"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  ice-postgres-data:
